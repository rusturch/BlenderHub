appId: com.rusturch.blender-hub
productName: Blender Hub
directories:
  buildResources: build
  output: dist
files:
  - 'out/**'
  # window and tray icons: electron-vite rewrites their imports to paths relative to
  # out/main, so the folder has to ship next to it rather than be bundled in
  - 'resources/**'
  - 'package.json'
# Windows ships as a plain folder in a zip (no installer): the exe runs in
# place, and the app keeps all its state in a data/ folder next to it, so the
# whole folder can be moved between machines or dropped into a cloud-synced
# directory. Releases 0.1.2–0.3.x shipped a single-file NSIS portable exe
# instead — it re-unpacked itself into a fresh temp dir on every launch, which
# made startup slow, broke the tray icon's path-keyed identity and let a second
# launch corrupt the running instance (electron-builder #7870).
win:
  target: zip
  # version-less on purpose: the self-updater downloads the asset by fixed name,
  # so a versioned one would go stale after the first update. Must match
  # updateZipName() in src/shared/launcher-updates.ts.
  artifactName: BlenderHub.${ext}
mac:
  category: public.app-category.graphics-design
  target: dmg
linux:
  target:
    - AppImage
  category: Graphics
  maintainer: Ruslan Turchin <63288413+rusturch@users.noreply.github.com>
npmRebuild: false
