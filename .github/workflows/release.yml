# Release pipeline: push a tag like v0.2.0 -> builds the Windows portable exe,
# publishes a DRAFT GitHub release with the exe + its .sha256. Review the draft
# on GitHub and press "Publish" — only published releases are visible to the
# in-app updater (it probes releases/latest, which ignores drafts).
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # the updater derives the asset filename from the release tag, so the tag
      # and package.json version must agree — fail fast when they drift. It also
      # only parses plain numeric tags: one published v1.2.3-beta would break the
      # update check for every installed client, so suffixed tags are refused.
      - name: Check tag matches package.json version
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($pkg -ne $tag) {
            Write-Error "Tag $env:GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          }
          if ($tag -notmatch '^\d+(\.\d+){1,3}$') {
            Write-Error "Tag must be plain numeric (vX.Y.Z) — the in-app updater cannot parse suffixed tags like v1.0.0-beta"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build portable exe
        run: npm run build:win

      - name: Write sha256 next to the exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*-portable.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'portable exe not found in dist/'; exit 1 }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          # "<hex>  <filename>" — the format the launcher's checksum parser expects
          "$hash  $($exe.Name)" | Out-File -Encoding ascii -NoNewline "$($exe.FullName).sha256"

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            --draft `
            --generate-notes `
            --title "Blender Hub $env:GITHUB_REF_NAME" `
            (Get-ChildItem dist/*-portable.exe).FullName `
            (Get-ChildItem dist/*-portable.exe.sha256).FullName

  # macOS build — a .dmg can only be produced on a macOS runner (not on Windows/Linux).
  # Caveats for personal use:
  #   • on a public repo, GitHub Actions runners (incl. macOS) are free; on a private repo macOS bills 10x.
  #   • the .dmg is UNSIGNED (no Apple Developer cert): on first open Gatekeeper blocks it —
  #     right-click → Open, or run `xattr -cr "/Applications/Blender Hub.app"`.
  #   • self-update does not run on macOS; the .dmg is a manual download from the release page.
  #   • macos-latest is Apple Silicon → this builds an arm64 .dmg (Intel Macs would need an x64 build).
  release-mac:
    needs: release-windows # the Windows job creates the draft release; this appends the .dmg to it
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build dmg
        run: npm run build:mac
      - name: Write sha256 next to the dmg
        run: |
          cd dist
          dmg=$(ls *.dmg | head -n1)
          shasum -a 256 "$dmg" > "$dmg.sha256"
      - name: Upload dmg to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.dmg.sha256
